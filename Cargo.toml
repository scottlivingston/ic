[package]
name = "ic"
version = "0.1.0"
edition = "2024"

[features]
default = []
diagnostics = []
pi = []

[dependencies]
bevy = { version = "0.17", default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_winit",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_log",
    "multi_threaded",
    "wayland",
    "embedded_watcher",
    "png",  # Required for PNG image loading
] }
bevy_mesh = "0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
# tokio-tungstenite = "0.26"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-all"] }
bytemuck = { version = "1", features = ["derive"] }
dirs = "6"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
